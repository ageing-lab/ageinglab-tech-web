<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Test simulación</title>
<style>
body{margin:0;background:#333;font:13px monospace;color:#0f0}
iframe{border:0;display:block;background:#fff}
#info{padding:6px 8px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f" src="servicios/interfaces-para-mayores.html"></iframe>
<div id="info">cargando…</div>
<script>
var f=document.getElementById('f'),q=new URLSearchParams(location.search);
var slide=+(q.get('s')||1),theme=q.get('t')||'',w=+(q.get('w')||360),h=+(q.get('h')||640);
var doSim=q.get('sim')!=='0',doExit=q.get('exit')==='1';
f.style.width=w+'px';f.style.height=h+'px';
var clicks=0,done=false;
f.addEventListener('load',function(){
  var d=f.contentDocument;
  if(theme)d.documentElement.setAttribute('data-theme',theme);
  if(doSim){var b=d.getElementById('sim-start');if(b)b.click()}
  var step=function(){
    var nx=d.getElementById('simnext'),cur=1;
    while(cur<slide&&nx&&!nx.disabled){nx.click();cur++;clicks++}
    if(doExit){var ex=d.getElementById('simexit');if(ex)ex.click()}
    if(q.get('ck')==='ok'){var ck=d.querySelector('.ck-ok');if(ck)ck.click()}
    var fire=function(){if(!done){done=true;setTimeout(report,250)}};
    if(d.fonts&&d.fonts.ready)d.fonts.ready.then(fire);else fire();
    setTimeout(fire,1500);
  };
  setTimeout(step,120);
});
function report(){
  var d=f.contentDocument,de=d.documentElement;
  var out=['qs='+location.search+' clicks='+clicks];
  var sim=de.getAttribute('data-sim');
  out.push('sim='+(sim||'NO'));
  var vis=[].slice.call(d.querySelectorAll('[data-slide]')).filter(function(s){return getComputedStyle(s).display!=='none'});
  out.push('slidesVisibles='+vis.length);
  var nav=d.getElementById('simnav');
  out.push('nav='+(getComputedStyle(nav).display!=='none'?'visible':'oculta'));
  var sw=d.documentElement.scrollHeight>d.documentElement.clientHeight;
  out.push('scrollPagina='+(sw?'SI('+d.documentElement.scrollHeight+'>'+d.documentElement.clientHeight+')':'no'));
  out.push('footer='+(getComputedStyle(d.querySelector('footer')).display==='none'?'oculto':'visible'));
  out.push('headerNav='+(getComputedStyle(d.querySelector('header nav')).display==='none'?'oculto':'visible'));
  out.push('headerBtn='+(getComputedStyle(d.querySelector('header .btn')).display==='none'?'oculto':'visible'));
  var texts=[].slice.call(d.querySelectorAll('[data-sim-text]'));
  var shortApplied=texts.filter(function(el){return el.innerHTML===el.dataset.simText}).length;
  out.push('textosCortos='+shortApplied+'/'+texts.length);
  var act=sim?d.querySelector('[data-slide].on'):null;
  if(act){
    out.push('slide='+act.id);
    var box=act.querySelector('.w'),re=act.getBoundingClientRect(),br=box.getBoundingClientRect();
    var fits=br.top>=re.top-1&&br.bottom<=re.bottom+1;
    out.push('cabe='+(fits?'SI':'NO(offTop='+Math.round(re.top-br.top)+',offBot='+Math.round(br.bottom-re.bottom)+')'));
    out.push('caja='+Math.round(br.height)+' disp='+Math.round(re.height));
    out.push('prog='+d.getElementById('simprog').textContent);
    out.push('prev='+(d.getElementById('simprev').disabled?'off':'on')+' next='+(d.getElementById('simnext').disabled?'off':'on'));
    var pf=d.activeElement;
    out.push('focus='+(pf?pf.tagName+'.'+(pf.className||pf.id||''):'ninguno'));
  }else{
    var hero=d.querySelector('.hero');
    out.push('heroScrollRestaurado='+(Math.abs(hero.getBoundingClientRect().top)<400?'SI':'NO(top='+Math.round(hero.getBoundingClientRect().top)+')'));
    out.push('dataSimAttr='+(sim===null?'eliminado':'presente'));
    var b2=d.getElementById('sim-start');
    out.push('botonSimVisible='+(b2&&getComputedStyle(b2).display!=='none'?'SI':'NO'));
    var pf2=d.activeElement;
    out.push('focus='+(pf2?pf2.tagName+'.'+(pf2.className||pf2.id||''):'ninguno'));
  }
  document.getElementById('info').textContent=out.join(' | ');
}
</script>
</body>
</html>
